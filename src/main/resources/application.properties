# Copilot Tracker Monitor Configuration

# Spring Boot Web Configuration
spring.application.name=CopilotTrackerMonitor
server.port=8080
server.servlet.context-path=/

# Multipart upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Excel file path
excel.file.path=C:\\Users\\671545\\Downloads\\GenAI -Tracker.xlsx

# Sheet names
excel.sheet.usage=New_Usage_Metrics
excel.sheet.users=User List

# Email configuration
email.enabled=false
email.smtp.host=smtp.office365.com
email.smtp.port=587
email.from.address=your-email@cognizant.com
email.from.password=your-password-or-app-password

# Tracker configuration
tracker.continuous.missing.days=5

# Date formats
date.input.format=MM/dd/yyyy
date.display.format=MM/dd/yyyy

# Chart configuration
chart.output.directory=dashboard-charts
chart.resource.top.count=15
